[package]
name = "pwtool"
description = "Password Tool: password generator and password manager (port of Password Tech)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pwtool-app = { path = "../pwtool-app" }
pwtool-core = { path = "../pwtool-core" }
zeroize = "1.9"
gtk4 = { version = "0.11", features = ["v4_10"] }
serde_json = "1"
async-channel = "2"

[target.'cfg(unix)'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["async-io", "global_shortcuts", "remote_desktop", "screencast", "gtk4_wayland", "gtk4_x11"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
