[package]
name = "pwtool"
description = "Password Tool: password generator and password manager (port of Password Tech)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pwtool"
path = "src/main.rs"

[dependencies]
pwtool-app = { path = "../pwtool-app" }
pwtool-core = { path = "../pwtool-core" }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["datepicker"] }
jiff = "0.2"
fontdb = "0.23"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }
zeroize = "1.9"
async-channel = "2"
rfd = "0.18"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
raw-window-handle = "0.6"
serde_json = "1"
ureq = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
