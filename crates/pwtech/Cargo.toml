[package]
name = "pwtech"
description = "Password Tech for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
ashpd = { version = "0.14", default-features = false, features = ["async-io", "global_shortcuts", "remote_desktop", "screencast", "gtk4_wayland", "gtk4_x11"] }
libc = "0.2"
pwtech-core = { path = "../pwtech-core" }
zeroize = "1.9"
gtk4 = { version = "0.11", features = ["v4_10"] }
serde_json = "1"
async-channel = "2"
