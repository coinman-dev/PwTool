[package]
name = "pwtool-app"
description = "Password Tool: application state, configuration, console mode and platform services, independent of the GUI toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pwtool-core = { path = "../pwtool-core" }
async-channel = "2"
async-io = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
png = "0.18"
serde_json = "1"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
serde = "1"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
ashpd = { version = "0.14", default-features = false, features = ["async-io", "global_shortcuts", "remote_desktop", "screencast", "notification", "inhibit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
