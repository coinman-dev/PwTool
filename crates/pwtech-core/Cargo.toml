[package]
name = "pwtech-core"
description = "Core of the Linux port of Password Tech: password generation, databases, crypto, RNG"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
blake2 = "0.11"
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.4"
flate2 = "1.1"
encoding_rs = "0.8"

libc = "0.2"
thiserror = "2"

[dev-dependencies]
hex = "0.4"

[build-dependencies]
cc = "1"
